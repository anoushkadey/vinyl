name: Publish site to GitHub Pages

# Builds the Vite site and publishes dist/ to the gh-pages branch.
# In the repo: Settings -> Pages -> Source: "Deploy from a branch",
# Branch: gh-pages, folder: / (root).
on:
  push:
    branches: [main, claude/vinyl-lyrics-player-8v2w0j]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish dist/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
